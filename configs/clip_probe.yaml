defaults:
  - _self_

hydra:
  run:
    dir: ${paths.project_root}/outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

paths:
  project_root: ${oc.env:CV_PROJECT_ROOT,.}
  metadata_index: ${paths.project_root}/data/metadata/chirality_index.jsonl
  feature_dir: ${paths.project_root}/data/features/clip
  output_dir: ${paths.project_root}/outputs/probes/clip

experiment:
  name: chirality_clip

backbone:
  family: clip
  # HF model id (ViT-B/16, ViT-L/14)
  model_id: openai/clip-vit-base-patch16
  image_size: 224
  use_open_clip: false
  open_clip_model: ViT-B-16
  open_clip_pretrained: laion2b_s34b_b88k

features:
  token: cls  # cls | patch_mean
  layers: [4, 8, 12]  # 1-based ViT block indices (12 = final block for depth-12 models)
  batch_size: 32
  num_workers: 4
  device: cuda

probe:
  task: binary_classification
  use_layernorm: true
  logistic: true  # BCEWithLogits; if false, use cross-entropy with 2 logits
  lr: 1e-3
  weight_decay: 1e-4
  epochs: 30
  val_fraction: 0.15
  seed: 42
  target_layer: 12  # which extracted layer to probe (must be in features.layers)

train:
  limit_samples: null
