defaults:
  - exp1/paths
  - exp1/render
  - exp1/tasks
  - _self_

hydra:
  run:
    dir: ${paths.project_root}/outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

experiment:
  name: exp1_bounded
  seed: 123
  description: Bounded non-toy Experiment 1 run focused on depth and normals.

paths:
  exp1_root: ${paths.project_root}/data/exp1_bounded
  probe_output_dir: ${paths.project_root}/outputs/exp1_bounded/probes
  results_dir: ${paths.project_root}/outputs/exp1_bounded/results
  figures_dir: ${paths.project_root}/outputs/exp1_bounded/figures
  logs_dir: ${paths.project_root}/outputs/exp1_bounded/logs

datasets:
  shapenet:
    categories: ["airplane", "bench", "bottle", "car", "chair", "lamp", "sofa", "table"]
    max_objects: 50
  objaverse:
    categories: ["chair", "table", "car", "airplane", "sofa", "lamp", "bottle", "mug"]
    max_objects: 50
    max_download_gb: 10.0
    batch_size: 8
    split: train

assets:
  max_objects: 50

render:
  resolution: [224, 224]
  samples: 32
  use_gpu: false
  chunk_size: 128

camera_grid:
  distances: [2.4, 2.8]
  azimuths_deg: [0.0, 90.0, 180.0, 270.0]
  elevations_deg: [15.0, 30.0]

lighting_grid:
  azimuths_deg: [45.0, 135.0]
  elevations_deg: [35.0]
  intensities: [2.5, 4.0]

scale_grid:
  values: [0.9, 1.1]

models:
  enabled: ["clip_vit_b16", "clip_vit_l14", "dinov2_vit_b"]
  layers: ["final", "layer4", "layer8", "layer12"]
  dense_layers: ["final", "layer8"]

tasks:
  enabled: ["dense_surface_normal_patches", "relative_depth_regions"]

probe:
  epochs: 20
  batch_size: 128
  evaluation:
    within_texture: true
    cross_texture: true
    bootstrap:
      enabled: true
      unit: object_id
      n_resamples: 500
      seed: ${experiment.seed}
  dense_surface_normal:
    epochs: 25
    batch_size: 128
    lr: 1.0e-3
    weight_decay: 1.0e-4
    use_layernorm: true
    evaluation:
      within_texture: true
      cross_texture: false
  dense_depth:
    epochs: 25
    batch_size: 128
    lr: 1.0e-3
    weight_decay: 1.0e-4
    use_layernorm: true
    evaluation:
      within_texture: true
      cross_texture: false

train:
  limit_samples: null
