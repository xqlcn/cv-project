# @package _global_

models:
  enabled: ["clip_vit_b16", "clip_vit_l14", "dinov2_vit_b"]
  layers: ["final", "layer4", "layer8", "layer12"]
  definitions:
    clip_vit_b16:
      family: clip
      model_id: openai/clip-vit-base-patch16
      image_size: 224
      use_open_clip: false
      open_clip_model: ViT-B-16
      open_clip_pretrained: laion2b_s34b_b88k
      supported_layers: ["final", "layer4", "layer8", "layer12"]
    clip_vit_l14:
      family: clip
      model_id: openai/clip-vit-large-patch14
      image_size: 224
      use_open_clip: false
      open_clip_model: ViT-L-14
      open_clip_pretrained: laion2b_s32b_b82k
      supported_layers: ["final", "layer4", "layer8", "layer12"]
    dinov2_vit_b:
      family: dino
      backend: transformers
      model_id: facebook/dinov2-base
      hub_name: dinov2_vitb14
      image_size: 518
      supported_layers: ["final", "layer4", "layer8", "layer12"]
    dinov2_vit_l:
      family: dino
      backend: transformers
      model_id: facebook/dinov2-large
      hub_name: dinov2_vitl14
      image_size: 518
      supported_layers: ["final", "layer4", "layer8", "layer12"]

features:
  token: cls
  batch_size: 32
  num_workers: 4
  device: cuda
  normalize: true
  use_amp: true
  use_random_augmentations: false
  cache_format: npz

tasks:
  enabled: ["dense_surface_normal_patches", "relative_depth_regions"]
  definitions:
    dense_surface_normal_patches:
      type: dense_regression
      metric: angular_error_deg_mean
      feature_mode: patch
      target_mode: camera_frame_normals
      head: linear_patch
      patch_target_transform:
        resize: resize_shortest_edge
        crop: center
        interpolation: nearest
      min_valid_fraction_per_patch: 0.25
      loss: masked_cosine
      metrics:
        - angular_error_deg_mean
        - angular_error_deg_median
        - within_11_25_deg
        - within_22_5_deg
        - within_30_deg
        - valid_patch_count_mean
    relative_depth_regions:
      type: multi_label_binary
      label_path: ${paths.labels_dir}/labels_relative_depth_regions.parquet
      metric: valid_pair_accuracy
      balanced_metric: balanced_accuracy
      grid_size: [3, 3]
      depth_statistic: median
      min_valid_fraction_per_region: 0.25
      min_depth_margin: 0.02
      use_foreground_bbox: false
      bbox_padding_fraction: 0.02
      validation:
        enabled: false
        min_active_pairs: 4
        min_valid_examples: 8
      region_pairs:
        - [0, 1]
        - [1, 2]
        - [3, 4]
        - [4, 5]
        - [6, 7]
        - [7, 8]
        - [0, 3]
        - [3, 6]
        - [1, 4]
        - [4, 7]
        - [2, 5]
        - [5, 8]
    dense_depth_patches:
      type: dense_regression
      metric: scale_invariant_abs_rel_mean
      feature_mode: patch
      target_mode: ssi_depth
      head: linear_patch
      patch_target_transform:
        resize: resize_shortest_edge
        crop: center
        interpolation: nearest
      depth_statistic: median
      min_valid_fraction_per_patch: 0.25
      loss: ssi_l1
      metrics:
        - ssi_l1_mean
        - ssi_l1_median
        - scale_aware_rmse_mean
        - scale_aware_abs_rel_mean
        - scale_aware_d1_mean
        - scale_aware_d2_mean
        - scale_aware_d3_mean
        - scale_invariant_rmse_mean
        - scale_invariant_abs_rel_mean
        - scale_invariant_d1_mean
        - scale_invariant_d2_mean
        - scale_invariant_d3_mean
        - pearson_r_mean
        - valid_patch_count_mean
    camera_distance:
      type: regression
      target: log_camera_distance
      label_path: ${paths.labels_dir}/labels_camera.parquet
      metric: mae
      enabled_in_full: true
    viewpoint:
      type: regression
      targets: ["azimuth_sin", "azimuth_cos", "elevation_sin", "elevation_cos"]
      label_path: ${paths.labels_dir}/labels_camera.parquet
      metric: angular_error_deg
      enabled_in_full: true
    lighting_direction:
      type: regression
      targets: ["light_dir_x", "light_dir_y", "light_dir_z"]
      label_path: ${paths.labels_dir}/labels_lighting.parquet
      metric: angular_error_deg
      enabled_in_full: true
    lighting_intensity:
      type: regression
      target: log_light_intensity
      label_path: ${paths.labels_dir}/labels_lighting.parquet
      metric: mae
      enabled_in_full: true
    apparent_scale:
      type: regression
      targets: ["object_scale", "foreground_area_fraction"]
      label_path: ${paths.labels_dir}/labels_scale.parquet
      metric: mae
      enabled_in_full: true

probe:
  head: linear
  use_layernorm: true
  lr: 1e-3
  weight_decay: 1e-4
  epochs: 30
  batch_size: 128
  val_metric: auto
  seed: ${experiment.seed}
  early_stopping:
    enabled: true
    patience: 8
    min_delta: 0.0
  losses:
    relative_depth_regions: bce_with_logits
    dense_surface_normal_patches: masked_cosine
    dense_depth_patches: ssi_l1
    regression_default: mse
  dense_surface_normal:
    task: dense_surface_normal_patches
    head: linear_patch
    feature_mode: patch
    target_mode: camera_frame_normals
    loss: masked_cosine
    min_valid_fraction_per_patch: 0.25
    epochs: 40
    batch_size: 256
    lr: 1.0e-3
    weight_decay: 1.0e-4
    use_layernorm: true
    scheduler: cosine_warmup
    warmup_epochs: 4
    monitor: val_angular_error_deg_mean
    evaluation:
      within_texture: true
      cross_texture: true
  dense_depth:
    task: dense_depth_patches
    head: linear_patch
    feature_mode: patch
    target_mode: ssi_depth
    loss: ssi_l1
    depth_statistic: median
    min_valid_fraction_per_patch: 0.25
    epochs: 40
    batch_size: 256
    lr: 1.0e-3
    weight_decay: 1.0e-4
    use_layernorm: true
    scheduler: cosine_warmup
    warmup_epochs: 4
    monitor: val_ssi_l1_mean
    evaluation:
      within_texture: true
      cross_texture: true
  evaluation:
    within_texture: true
    cross_texture: true
    bootstrap:
      enabled: true
      unit: object_id
      n_resamples: 1000
      seed: ${experiment.seed}
