defaults:
  - _self_

hydra:
  run:
    dir: ${paths.project_root}/outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

paths:
  project_root: ${oc.env:CV_PROJECT_ROOT,.}
  metadata_index: ${paths.project_root}/data/processed/modelnet40/metadata/modelnet40_views.jsonl
  feature_dir: ${paths.project_root}/data/features/modelnet40_clip
  output_dir: ${paths.project_root}/outputs/probes/modelnet40_clip
  checkpoint: null

experiment:
  name: modelnet40_clip_probe

backbone:
  family: clip
  model_id: openai/clip-vit-base-patch16
  image_size: 224
  use_open_clip: false
  open_clip_model: ViT-B-16
  open_clip_pretrained: laion2b_s34b_b88k

features:
  token: cls
  layers: [4, 8, 12]
  batch_size: 64
  num_workers: 4
  device: cuda

probe:
  task: multiclass
  num_classes: 40
  use_layernorm: true
  lr: 1e-3
  weight_decay: 1e-4
  epochs: 20
  val_fraction: 0.15
  seed: 42
  target_layer: 12

train:
  limit_samples: null
