defaults:
  - exp1/paths
  - exp1/render
  - exp1/tasks
  - _self_

hydra:
  run:
    dir: ${paths.project_root}/outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

experiment:
  name: exp1_under12h
  seed: 20260512
  description: Under-12-hour sampled Experiment 1 main geometry benchmark.

paths:
  exp1_root: ${paths.project_root}/data/exp1_under12h
  probe_output_dir: ${paths.project_root}/outputs/exp1_under12h/probes
  results_dir: ${paths.project_root}/outputs/exp1_under12h/results
  figures_dir: ${paths.project_root}/outputs/exp1_under12h/figures
  logs_dir: ${paths.project_root}/outputs/exp1_under12h/logs

datasets:
  shapenet:
    repo_id: ShapeNet/ShapeNetCore
    local_dir: ${paths.shapenet_hf_root}
    extract_archives: true
    download: true
    categories: ["airplane", "bench", "bottle", "car", "chair", "lamp", "sofa", "table"]
    max_objects: 1000
  objaverse:
    categories: ["airplane", "bench", "bottle", "car", "chair", "lamp", "sofa", "table"]
    max_objects: 1000

assets:
  categories: ["airplane", "bench", "bottle", "car", "chair", "lamp", "sofa", "table"]
  required_categories: ["airplane", "bench", "bottle", "car", "chair", "lamp", "sofa", "table"]
  max_objects: null
  max_objects_per_category: 60
  min_objects_per_category: 60
  fail_on_missing_requested_categories: true

splits:
  stratify_by_category: true

render:
  resolution: [224, 224]
  samples: 32
  use_gpu: false
  chunk_size: 256
  parallel_workers: 4
  qc:
    min_random_noise_rgb_std: 0.02
    fail_low_random_noise_variation: false
    fail_random_noise_image_texture: true
    fail_material_override_mismatch: true

textures:
  random_noise:
    mapping: object
    node_type: procedural_noise

camera_grid:
  distances: [1.8]
  azimuths_deg: [0.0]
  elevations_deg: [20.0]

lighting_grid:
  azimuths_deg: [45.0]
  elevations_deg: [35.0]
  intensities: [3.0]

scale_grid:
  values: [1.0]

render_plan:
  mode: sampled
  pose_samples_per_object: 6
  sampled:
    camera_distance: 1.9
    camera_distances: null
    azimuth_range_deg: [0.0, 360.0]
    elevation_range_deg: [10.0, 35.0]
    light_azimuth_range_deg: [0.0, 360.0]
    light_elevation_range_deg: [20.0, 60.0]
    light_intensity_range: [2.0, 4.5]
    object_scale_range: [0.9, 1.05]

models:
  enabled: ["clip_vit_b16", "clip_vit_l14", "dinov2_vit_b"]
  layers: ["final", "layer4", "layer8", "layer12"]
  dense_enabled: ["clip_vit_b16", "clip_vit_l14", "dinov2_vit_b"]
  dense_layers: ["final", "layer4", "layer8", "layer12"]
  definitions:
    dinov2_vit_b:
      image_size: 224

features:
  batch_size: 64
  num_workers: 4
  use_amp: true

tasks:
  enabled:
    - dense_surface_normal_patches
    - relative_depth_regions
    - viewpoint
    - lighting_direction
    - lighting_intensity
    - apparent_scale
  definitions:
    relative_depth_regions:
      use_foreground_bbox: true
      bbox_padding_fraction: 0.02
      validation:
        enabled: true
        min_active_pairs: 4
        min_valid_examples: 8

probe:
  epochs: 20
  batch_size: 256
  evaluation:
    within_texture: true
    cross_texture: true
    bootstrap:
      enabled: true
      unit: object_id
      n_resamples: 500
      seed: ${experiment.seed}

train:
  limit_samples: null
