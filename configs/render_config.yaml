# Blender chirality rendering. Set CV_PROJECT_ROOT to the repo root, or use defaults below.
# Blender loads this file with PyYAML only (no OmegaConf); keep paths simple.
project_root: "."  # overridden by CLI --project-root

paths:
  # Generate with: python scripts/prepare_modelnet_manifest.py --modelnet-root ... --output ...
  mesh_manifest: "data/metadata/modelnet40_manifest.json"
  output_images: "data/rendered/chirality"
  output_metadata: "data/metadata/chirality_index.jsonl"

render:
  resolution: [512, 512]
  engine: CYCLES
  samples: 64
  use_gpu: true
  transparent_background: false
  file_format: PNG

# World / background
world:
  bg_color: [0.05, 0.05, 0.06, 1.0]

# Camera intrinsics / extrinsics (Blender camera)
camera:
  fov_deg: 50.0
  clip_start: 0.01
  clip_end: 1000.0

# Chirality experiment: original + mirror; optional viewpoint jitter for similarity baseline
chirality:
  mirror_axis: X  # X, Y, or Z in object space after normalization
  # Multiple viewpoints per object (radians for azimuth/elevation)
  viewpoints:
    - { azimuth: 0.0, elevation: 0.35, distance: 2.8 }
    - { azimuth: 0.9, elevation: 0.25, distance: 2.8 }
    - { azimuth: -1.1, elevation: 0.45, distance: 3.0 }
  # Small azimuth delta (radians) for "same object, shifted view" cosine baseline
  view_jitter_rad: 0.12

lighting:
  sun_energy: 3.0
  sun_angles_deg: [40.0, 30.0]  # elevation, azimuth of sun direction (world)
  fill_energy: 0.35

# Texture conditions: photorealistic | flat | noise (requires UVs / material setup)
texture:
  default_type: flat

# Limits (set max_objects null for all in manifest)
limits:
  max_objects: null
  seed: 42
