defaults:
  - exp1_under12h
  - _self_

experiment:
  name: exp1_under12h_camera_distance
  description: Small sampled add-on pack for camera-distance probing.

paths:
  exp1_root: ${paths.project_root}/data/exp1_under12h_camera_distance
  probe_output_dir: ${paths.project_root}/outputs/exp1_under12h_camera_distance/probes
  results_dir: ${paths.project_root}/outputs/exp1_under12h_camera_distance/results
  figures_dir: ${paths.project_root}/outputs/exp1_under12h_camera_distance/figures
  logs_dir: ${paths.project_root}/outputs/exp1_under12h_camera_distance/logs

assets:
  max_objects_per_category: 20
  min_objects_per_category: 20

render_plan:
  pose_samples_per_object: 2
  sampled:
    camera_distance: null
    camera_distances: [2.3, 2.8, 3.3]

tasks:
  enabled:
    - camera_distance

probe:
  epochs: 20
  batch_size: 256
  evaluation:
    within_texture: true
    cross_texture: true
