defaults:
  - _self_

hydra:
  run:
    dir: ${paths.project_root}/outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

paths:
  project_root: ${oc.env:CV_PROJECT_ROOT,.}
  metadata_index: ${paths.project_root}/data/metadata/chirality_index.jsonl
  feature_dir: ${paths.project_root}/data/features/dino
  output_dir: ${paths.project_root}/outputs/probes/dino

experiment:
  name: chirality_dino

backbone:
  family: dino
  # torch.hub repo id: dinov2_vitb14 | dinov2_vitl14 | dinov2_vits14
  hub_name: dinov2_vitb14
  image_size: 518

features:
  token: cls
  layers: [4, 8, 12]
  batch_size: 32
  num_workers: 4
  device: cuda

probe:
  task: binary_classification
  use_layernorm: true
  logistic: true
  lr: 1e-3
  weight_decay: 1e-4
  epochs: 30
  val_fraction: 0.15
  seed: 42
  target_layer: 12

train:
  limit_samples: null
