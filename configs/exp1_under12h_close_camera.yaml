defaults:
  - exp1_under12h
  - _self_

experiment:
  name: exp1_under12h_close_camera
  description: Under-12-hour sampled Experiment 1 with closer camera distance for larger foreground objects.

paths:
  exp1_root: ${paths.project_root}/data/exp1_under12h_close_camera
  probe_output_dir: ${paths.project_root}/outputs/exp1_under12h_close_camera/probes
  results_dir: ${paths.project_root}/outputs/exp1_under12h_close_camera/results
  figures_dir: ${paths.project_root}/outputs/exp1_under12h_close_camera/figures
  logs_dir: ${paths.project_root}/outputs/exp1_under12h_close_camera/logs

camera_grid:
  distances: [2.2]

render_plan:
  sampled:
    camera_distance: 2.2
