experiment:
  name: exp1_full_pipeline_reduced_shapenet
  seed: 20260512
  description: Reduced local ShapeNet Experiment 1 full-pipeline run.

paths:
  project_root: ${oc.env:CV_PROJECT_ROOT,.}
  exp1_root: ${paths.project_root}/data/exp1_full_pipeline_shapenet_run
  asset_manifest: ${paths.exp1_root}/manifests/assets.jsonl
  normalized_asset_manifest: ${paths.exp1_root}/manifests/assets_normalized.jsonl
  split_manifest: ${paths.exp1_root}/manifests/object_splits.jsonl
  render_plan: ${paths.exp1_root}/manifests/render_plan.parquet
  render_plan_jsonl: ${paths.exp1_root}/manifests/render_plan.jsonl
  render_qc_manifest: ${paths.exp1_root}/manifests/render_qc.parquet
  valid_render_manifest: ${paths.exp1_root}/manifests/render_valid.parquet
  contact_sheet: ${paths.exp1_root}/qc/contact_sheet.png
  render_chunks_dir: ${paths.exp1_root}/manifests/render_chunks
  render_root: ${paths.exp1_root}/renders
  labels_dir: ${paths.exp1_root}/labels
  feature_dir: ${paths.exp1_root}/features
  probe_output_dir: ${paths.project_root}/outputs/exp1_full_pipeline_shapenet_run/probes
  results_dir: ${paths.project_root}/outputs/exp1_full_pipeline_shapenet_run/results
  figures_dir: ${paths.project_root}/outputs/exp1_full_pipeline_shapenet_run/figures
  logs_dir: ${paths.project_root}/outputs/exp1_full_pipeline_shapenet_run/logs
  shapenet_hf_root: ${paths.project_root}/data/shapenet_hf/ShapeNetCore
  shapenet_hf_extracted_root: ${paths.project_root}/data/shapenet_hf/extracted
  objaverse_root: ${paths.project_root}/data/objaverse

assets:
  sources: []
  allowed_extensions: [".obj", ".glb", ".gltf", ".fbx", ".ply", ".off"]
  max_objects: 3
  require_normalized_mesh: false
  split_from_manifest: false

splits:
  object_disjoint: true
  seed: ${experiment.seed}
  labels: ["train", "val", "test"]
  fractions:
    train: 0.5
    val: 0.25
    test: 0.25

render:
  backend: blender
  engine: CYCLES
  resolution: [64, 64]
  samples: 4
  use_gpu: false
  transparent_background: false
  file_format: PNG
  fail_fast: false
  chunk_size: 24
  output_contract:
    rgb_filename: rgb.png
    depth_filename: depth.npy
    normal_filename: normal_camera.npy
    mask_filename: mask.npy
    metadata_filename: render_meta.json
  camera:
    fov_deg: 50.0
    clip_start: 0.01
    clip_end: 1000.0
  world:
    bg_color: [0.05, 0.05, 0.06, 1.0]
  qc:
    min_foreground_fraction: 0.01
    max_foreground_fraction: 0.95
    min_depth_valid_fraction: 0.9
    normal_norm_tolerance: 0.1
    depth_atol: 0.0001
    normal_atol: 0.0001

textures:
  conditions: ["photorealistic", "flat", "random_noise"]
  photorealistic:
    preserve_imported_materials: true
    fallback_color_rgb: [0.68, 0.68, 0.68]
    fallback_roughness: 0.55
    record_fallback_status: true
    textureless_source_datasets: ["synthetic_primitives"]
  flat:
    color_rgb: [0.62, 0.62, 0.62]
    roughness: 0.55
    use_emission: false
  random_noise:
    deterministic: true
    seed_offset: 100000
    texture_size: [128, 128]
    color_space: sRGB
    category_correlated: false
    scale_range: [8.0, 20.0]
    detail: 6.0
    roughness: 0.55

camera_grid:
  distances: [2.4, 2.8]
  azimuths_deg: [0.0, 90.0]
  elevations_deg: [20.0]
  fov_deg: ${render.camera.fov_deg}

lighting_grid:
  light_type: sun
  azimuths_deg: [45.0]
  elevations_deg: [35.0]
  intensities: [2.5, 4.0]
  fill_intensity: 0.35

scale_grid:
  values: [1.0]

render_plan:
  id_version: v1
  seed: ${experiment.seed}
  include_failed_rows: true
  preserve_split_labels: false
  texture_control_fields:
    - object_id
    - camera_distance
    - camera_azimuth_deg
    - camera_elevation_deg
    - camera_fov_deg
    - object_scale
    - light_type
    - light_azimuth_deg
    - light_elevation_deg
    - light_intensity

models:
  enabled: ["clip_vit_b16", "clip_vit_l14", "dinov2_vit_b"]
  layers: ["final", "layer4", "layer8", "layer12"]
  definitions:
    clip_vit_b16:
      family: clip
      model_id: openai/clip-vit-base-patch16
      image_size: 224
      use_open_clip: false
      open_clip_model: ViT-B-16
      open_clip_pretrained: laion2b_s34b_b88k
      supported_layers: ["final", "layer4", "layer8", "layer12"]
    clip_vit_l14:
      family: clip
      model_id: openai/clip-vit-large-patch14
      image_size: 224
      use_open_clip: false
      open_clip_model: ViT-L-14
      open_clip_pretrained: laion2b_s32b_b82k
      supported_layers: ["final", "layer4", "layer8", "layer12"]
    dinov2_vit_b:
      family: dino
      backend: transformers
      model_id: facebook/dinov2-base
      hub_name: dinov2_vitb14
      image_size: 518
      supported_layers: ["final", "layer4", "layer8", "layer12"]

features:
  token: cls
  batch_size: 4
  num_workers: 0
  device: cpu
  normalize: true
  use_random_augmentations: false
  cache_format: npz

tasks:
  enabled:
    - surface_normal_aggregate
    - relative_depth_regions
    - camera_distance
    - viewpoint
    - lighting_direction
    - lighting_intensity
    - apparent_scale
  definitions:
    surface_normal_aggregate:
      type: regression
      target_columns: ["mean_normal_x", "mean_normal_y", "mean_normal_z"]
      label_path: ${paths.labels_dir}/labels_surface_normal_aggregate.parquet
      metric: angular_error_deg
      min_valid_pixels: 16
    relative_depth_regions:
      type: multi_label_binary
      label_path: ${paths.labels_dir}/labels_relative_depth_regions.parquet
      metric: valid_pair_accuracy
      balanced_metric: balanced_accuracy
      grid_size: [3, 3]
      depth_statistic: median
      min_valid_fraction_per_region: 0.01
      min_depth_margin: 0.0
      region_pairs:
        - [0, 1]
        - [1, 2]
        - [3, 4]
        - [4, 5]
        - [6, 7]
        - [7, 8]
        - [0, 3]
        - [3, 6]
        - [1, 4]
        - [4, 7]
        - [2, 5]
        - [5, 8]
    camera_distance:
      type: regression
      target: log_camera_distance
      label_path: ${paths.labels_dir}/labels_camera.parquet
      metric: mae
    viewpoint:
      type: regression
      targets: ["azimuth_sin", "azimuth_cos", "elevation_sin", "elevation_cos"]
      label_path: ${paths.labels_dir}/labels_camera.parquet
      metric: angular_error_deg
    lighting_direction:
      type: regression
      targets: ["light_dir_x", "light_dir_y", "light_dir_z"]
      label_path: ${paths.labels_dir}/labels_lighting.parquet
      metric: angular_error_deg
    lighting_intensity:
      type: regression
      target: log_light_intensity
      label_path: ${paths.labels_dir}/labels_lighting.parquet
      metric: mae
    apparent_scale:
      type: regression
      targets: ["object_scale", "foreground_area_fraction"]
      label_path: ${paths.labels_dir}/labels_scale.parquet
      metric: mae

probe:
  head: linear
  use_layernorm: true
  lr: 1e-3
  weight_decay: 1e-4
  epochs: 3
  batch_size: 16
  val_metric: auto
  seed: ${experiment.seed}
  early_stopping:
    enabled: false
    patience: 2
    min_delta: 0.0
  losses:
    surface_normal_aggregate: cosine
    relative_depth_regions: bce_with_logits
    regression_default: mse
  evaluation:
    within_texture: true
    cross_texture: false
    bootstrap:
      enabled: true
      unit: object_id
      n_resamples: 100
      seed: ${experiment.seed}

train:
  limit_samples: null
